<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>行李箱空間有限・滿單即收單 🌸</title>
  <style>
    :root {
      --primary: #f472b6;
      --primary-hover: #ec4899;
      --bg: #fff5f7;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #4a4a4a;
      --text-muted: #8c8c8c;
      --border: #ffd1dc;
      --accent: #fb7185;
      --shadow: 0 10px 25px -5px rgba(244, 114, 182, 0.15), 0 8px 10px -6px rgba(244, 114, 182, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #ffeef2 0%, #fff5f7 50%, #fce7f3 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px 12px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 頂部 Header 卡片 */
    .header-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px 16px;
      text-align: center;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .header-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #be185d;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .rate-box {
      background: linear-gradient(135deg, #be185d, #ec4899);
      color: #fff;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      box-shadow: 0 4px 12px rgba(190, 24, 93, 0.2);
      margin-bottom: 14px;
    }

    .rate-box .formula {
      font-size: 1.05rem;
      font-weight: 800;
      margin: 4px 0;
      letter-spacing: 0.5px;
    }

    .rate-box .rules {
      font-size: 0.75rem;
      opacity: 0.92;
      margin-top: 4px;
    }

    .badge-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .badge-deadline {
      background: #fef2f2;
      color: #ef4444;
      border: 1px solid #fecaca;
    }

    .badge-shipping {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }

    /* 流程圖強迫症極致對稱 */
    .steps-container {
      display: grid;
      grid-template-columns: 1fr 1.1fr 1fr;
      align-items: flex-start;
      gap: 4px;
      background: #fff;
      padding: 14px 8px;
      border-radius: 16px;
      border: 1px dashed var(--border);
    }

    .step-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .step-title {
      font-size: 0.78rem;
      font-weight: 800;
      color: #be185d;
      white-space: nowrap;
      margin-bottom: 5px;
    }

    .step-desc {
      font-size: 0.68rem;
      color: var(--text-muted);
      line-height: 1.35;
      min-height: 2.7em;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .step-arrow {
      color: var(--primary);
      font-size: 0.8rem;
      opacity: 0.6;
      margin-top: 2px;
    }

    /* 主表單卡片 */
    .form-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #4a4a4a;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .field-label .req {
      color: #ef4444;
      font-size: 0.75rem;
    }

    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #fbcfe8;
      background: #fff;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      transition: all 0.2s;
    }

    .field-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(244, 114, 182, 0.2);
    }

    /* 商品清單容器 */
    .items-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
    }

    .items-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #be185d;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .item-card {
      background: #ffffff;
      border-radius: 16px;
      border: 1.5px solid #ffd1dc;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      margin-top: 10px;
    }

    .item-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-badge {
      background: #fdf2f8;
      color: #db2777;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid #fbcfe8;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 0.75rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .btn-delete:hover {
      color: #ef4444;
    }

    /* 上傳照片與商品資訊橫排 */
    .item-main-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 12px;
    }

    .img-upload-box {
      width: 100px;
      height: 100px;
      border: 2px dashed #f472b6;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fff5f7;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .img-upload-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .img-upload-box .upload-tip {
      font-size: 0.65rem;
      color: #ec4899;
      text-align: center;
      padding: 4px;
      font-weight: 600;
    }

    .item-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sm-input {
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid #fce7f3;
      font-size: 0.82rem;
      outline: none;
    }

    .sm-input:focus {
      border-color: var(--primary);
    }

    /* 購買地點網格對齊 (Grid 化) */
    .location-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-top: 2px;
    }

    .loc-btn {
      padding: 8px 2px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 10px;
      border: 1.5px solid #e5e7eb;
      background: #fff;
      color: #4b5563;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .loc-btn.active {
      background: #fdf2f8;
      border-color: #ec4899;
      color: #db2777;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(236, 72, 153, 0.15);
    }

    /* 數量與備選方案 */
    .item-footer-row {
      display: grid;
      grid-template-columns: 85px 1fr;
      gap: 8px;
      align-items: center;
    }

    .qty-box {
      display: flex;
      align-items: center;
      border: 1.5px solid #fbcfe8;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .qty-btn {
      width: 26px;
      height: 32px;
      background: #fff5f7;
      border: none;
      color: #db2777;
      font-weight: bold;
      cursor: pointer;
    }

    .qty-val {
      flex: 1;
      text-align: center;
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      outline: none;
    }

    .fallback-select {
      width: 100%;
      height: 34px;
      padding: 0 8px;
      border-radius: 10px;
      border: 1.5px solid #fce7f3;
      font-size: 0.78rem;
      color: var(--text);
      background: #fff;
      outline: none;
    }

    /* 新增商品按鈕 */
    .btn-add-item {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 2px dashed #f472b6;
      background: #fff5f7;
      color: #db2777;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
      margin-top: 6px;
    }

    .btn-add-item:hover {
      background: #fce7f3;
    }

    /* 送出按鈕 */
    .btn-submit {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #ec4899, #be185d);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(190, 24, 93, 0.25);
      transition: all 0.2s;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      background: #d1d5db;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* 成功彈窗 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal {
      background: #fff;
      width: 100%;
      max-width: 360px;
      border-radius: 24px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .success-icon {
      width: 50px;
      height: 50px;
      background: #fdf2f8;
      color: #ec4899;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .order-tag {
      font-size: 1.35rem;
      font-weight: 900;
      color: #be185d;
      letter-spacing: 1px;
      margin: 4px 0;
      background: #fff5f7;
      padding: 6px 14px;
      border-radius: 12px;
      border: 1.5px dashed #fbcfe8;
    }

    .btn-copy {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #fbcfe8;
      background: #fff;
      color: #db2777;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-notice {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 12px;
      padding: 10px;
      font-size: 0.75rem;
      color: #9f1239;
      line-height: 1.4;
      text-align: left;
      width: 100%;
    }

    .btn-done {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: #ec4899;
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頂部資訊 -->
    <div class="header-card">
      <div class="header-title">🧳 行李箱空間有限・滿單即收單 ⏰</div>
      
      <div class="rate-box">
        <div>TT 🌸 演算法綠分限定 🌸 TT</div>
        <div class="formula">✨ 商品計算：商品稅後價 × 0.22315</div>
        <div class="rules">* 只接總金額台幣 1000-5000 以上訂單</div>
      </div>

      <div class="badge-row">
        <span class="badge badge-deadline">⏳ 收單截止：9/29 10:00</span>
        <span class="badge badge-shipping">📦 回台出貨：10/2起陸續寄出</span>
      </div>

      <!-- 強迫症對稱三步驟流程 -->
      <div class="steps-container">
        <div class="step-col">
          <div class="step-title">1. 填單截圖</div>
          <div class="step-desc">
            <span>填寫委託清單</span>
            <span>送出截圖保存</span>
          </div>
        </div>
        <div class="step-col">
          <div class="step-title">2. 私訊 Threads 小盒子</div>
          <div class="step-desc">
            <span>私訊傳送截圖</span>
            <span>提供對帳資料</span>
          </div>
        </div>
        <div class="step-col">
          <div class="step-title">3. 連線採買</div>
          <div class="step-desc">
            <span>現場確認庫存</span>
            <span>回台迅速出貨</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 表單卡片 -->
    <div class="form-card">
      <div class="field-group">
        <label class="field-label">委託人 Threads 帳號 <span class="req">(必填) 🌸</span></label>
        <input type="text" id="threadsAccount" class="field-input" placeholder="@ 請輸入帳號">
      </div>

      <div class="field-group">
        <label class="field-label">匯款末五碼 <span class="req">(選填) 💳</span></label>
        <input type="text" id="bankLast5" class="field-input" maxlength="5" placeholder="可先填或私訊時告知">
      </div>

      <div class="items-header">
        <div class="items-title">🛍️ 委託商品清單</div>
      </div>

      <div id="itemsContainer"></div>

      <button type="button" class="btn-add-item" onclick="addNewItem()">
        ➕ 增加委託商品
      </button>

      <button type="button" id="submitBtn" class="btn-submit" onclick="submitOrder()">
        確認送出委託單 🌸
      </button>
    </div>
  </div>

  <!-- 成功彈窗 -->
  <div class="modal-overlay" id="successModal">
    <div class="modal">
      <div class="success-icon">✓</div>
      <h3 style="color: #be185d; font-size: 1.15rem; font-weight: 800;">委託已送出，請截圖保存！🌸</h3>
      <div style="font-size: 0.75rem; color: #8c8c8c;">你的專屬訂單編號</div>
      <div class="order-tag" id="displayOrderNo">TK000000-0000</div>
      <button type="button" class="btn-copy" onclick="copyOrderNo()">📋 複製編號</button>
      
      <div class="modal-notice">
        <b>請截圖這個畫面並私訊 Threads 小盒子</b>，附上訂單編號與匯款末 5 碼對帳唷！
      </div>

      <button type="button" class="btn-done" onclick="closeModal()">完成</button>
    </div>
  </div>

  <script>
    // 你的 Google Apps Script 部署 URL
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwk_P11xETiasuyq0hEUz1YdyPK50V162o9-cT0FqYnrxccg4rCKFgSS1NexJlg76Lpb/exec";

    // 8 大地點選項 (4x2 完美網格)
    const LOCATIONS = [
      "精品專櫃", "專櫃美妝", "Bic Camera", "日本藥妝",
      "堂吉訶德", "三麗鷗", "寶可夢", "其他地點"
    ];

    let itemsData = [];

    function generateOrderNo() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let rand = "";
      for (let i = 0; i < 4; i++) {
        rand += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `TK${yy}${mm}${dd}-${rand}`;
    }

    function addNewItem() {
      const id = Date.now();
      itemsData.push({
        id: id,
        image: "",
        name: "",
        variant: "",
        brand: LOCATIONS[0],
        qty: 1,
        fallback: "cancel",
        fallbackNote: ""
      });
      renderItems();
    }

    function removeItem(id) {
      if (itemsData.length <= 1) {
        alert("至少需要保留一項商品唷！");
        return;
      }
      itemsData = itemsData.filter(item => item.id !== id);
      renderItems();
    }

    function renderItems() {
      const container = document.getElementById("itemsContainer");
      container.innerHTML = "";

      itemsData.forEach((item, index) => {
        const itemEl = document.createElement("div");
        itemEl.className = "item-card";
        itemEl.innerHTML = `
          <div class="item-card-header">
            <span class="item-badge">商品 ${index + 1}</span>
            <button type="button" class="btn-delete" onclick="removeItem(${item.id})">🗑 刪除</button>
          </div>

          <div class="item-main-row">
            <div class="img-upload-box" onclick="document.getElementById('file_${item.id}').click()">
              <input type="file" id="file_${item.id}" accept="image/*" style="display:none" onchange="handleImage(event, ${item.id})">
              ${item.image ? `<img src="${item.image}">` : `<div class="upload-tip">📷 上傳截圖<br>(必填)<br><span style="font-size:0.55rem;opacity:0.8">1:1 或 4:3</span></div>`}
            </div>

            <div class="item-inputs">
              <input type="text" class="sm-input" placeholder="日文品名 / 貨號 (必填)" value="${item.name}" oninput="updateItemField(${item.id}, 'name', this.value)">
              <input type="text" class="sm-input" placeholder="樣式 / 容量 / 顏色 / 尺寸 (選填)" value="${item.variant}" oninput="updateItemField(${item.id}, 'variant', this.value)">
            </div>
          </div>

          <div class="field-group" style="gap:4px;">
            <label class="field-label" style="font-size:0.75rem;">哪裡購買 (必填) 🌸</label>
            <div class="location-grid">
              ${LOCATIONS.map(loc => `
                <button type="button" class="loc-btn ${item.brand === loc ? 'active' : ''}" onclick="selectLocation(${item.id}, '${loc}')">${loc}</button>
              `).join('')}
            </div>
          </div>

          <div class="item-footer-row">
            <div class="qty-box">
              <button type="button" class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
              <input type="text" class="qty-val" value="${item.qty}" readonly>
              <button type="button" class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
            </div>

            <select class="fallback-select" onchange="updateFallback(${item.id}, this.value)">
              <option value="cancel" ${item.fallback === 'cancel' ? 'selected' : ''}>缺貨處置：缺貨則取消該品項</option>
              <option value="substitute" ${item.fallback === 'substitute' ? 'selected' : ''}>缺貨處置：換其他顏色/規格</option>
            </select>
          </div>

          ${item.fallback === 'substitute' ? `
            <input type="text" class="sm-input" placeholder="請備註候補款式或顏色" value="${item.fallbackNote \vert{}\vert{} ''}" oninput="updateItemField(${item.id}, 'fallbackNote', this.value)">
          ` : ''}
        `;
        container.appendChild(itemEl);
      });
    }

    function updateItemField(id, field, val) {
      const item = itemsData.find(i => i.id === id);
      if (item) item[field] = val;
    }

    function selectLocation(id, loc) {
      const item = itemsData.find(i => i.id === id);
      if (item) {
        item.brand = loc;
        renderItems();
      }
    }

    function changeQty(id, delta) {
      const item = itemsData.find(i => i.id === id);
      if (item) {
        item.qty = Math.max(1, item.qty + delta);
        renderItems();
      }
    }

    function updateFallback(id, val) {
      const item = itemsData.find(i => i.id === id);
      if (item) {
        item.fallback = val;
        renderItems();
      }
    }

    function handleImage(e, id) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const maxDim = 900;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL("image/jpeg", 0.75);

          const item = itemsData.find(i => i.id === id);
          if (item) {
            item.image = compressed;
            renderItems();
          }
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function submitOrder() {
      const threads = document.getElementById("threadsAccount").value.trim();
      const last5 = document.getElementById("bankLast5").value.trim();

      if (!threads) {
        alert("請填寫委託人 Threads 帳號唷！");
        document.getElementById("threadsAccount").focus();
        return;
      }

      for (let i = 0; i < itemsData.length; i++) {
        const item = itemsData[i];
        if (!item.image) {
          alert(`商品 ${i + 1} 尚未上傳商品照片唷！`);
          return;
        }
        if (!item.name.trim()) {
          alert(`請填寫商品 ${i + 1} 的品名或貨號！`);
          return;
        }
      }

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.disabled = true;
      submitBtn.innerText = "連線送單中，請稍候... 🌸";

      const orderNo = generateOrderNo();
      const payload = {
        orderNo: orderNo,
        threads: threads,
        last5: last5,
        items: itemsData
      };

      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result && result.ok) {
          document.getElementById("displayOrderNo").innerText = orderNo;
          document.getElementById("successModal").style.display = "flex";
        } else {
          alert("送單失敗：" + (result.error || "請稍後再試"));
        }
      } catch (err) {
        alert("送單完成！請截圖保存編號，或稍後至 Threads 對帳！");
        document.getElementById("displayOrderNo").innerText = orderNo;
        document.getElementById("successModal").style.display = "flex";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "確認送出委託單 🌸";
      }
    }

    function copyOrderNo() {
      const no = document.getElementById("displayOrderNo").innerText;
      navigator.clipboard.writeText(no).then(() => {
        alert("單號已複製：" + no);
      });
    }

    function closeModal() {
      document.getElementById("successModal").style.display = "none";
      location.reload();
    }

    // 初始化第一個商品
    addNewItem();
  </script>
</body>
</html>
